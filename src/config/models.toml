# Model registry. Add a [[model]] block to register a new model — no code changes.
#   name      : identifier used in outputs and plots
#   family    : grouping for family-panel plots (goldfish / Llama / Qwen / gemma / ...)
#   hf_id     : HuggingFace repo id. Required for the eval job script to pick it up.
#               Omit it for models evaluated by a different script (e.g. goldfish).
#   revisions : optional list of HF revisions (checkpoints). Defaults to ["main"].
#   langs     : optional list of languages. Omit to use the job script's full LANGS list.
#   path      : glob under RESULTS/model_results, matching that model's *_minimal_pairs.tsv
#
# Note: globs are case-sensitive on Linux (the cluster). Match the real dir casing.


[[model]]
name = "goldfish_100mb"
family = "goldfish"
path = "goldfish-models/*_100mb/**/*_minimal_pairs.tsv"

[[model]]
name = "goldfish_1000mb"
family = "goldfish"
path = "goldfish-models/*_1000mb/**/*_minimal_pairs.tsv"

